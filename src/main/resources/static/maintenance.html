<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB Hire - Maintenance Management Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Barlow', sans-serif; background-color: #f8fafc; font-size: 15px; } .font-condensed { font-family: 'Barlow Condensed', sans-serif; } </style>
</head>
<body class="h-screen overflow-hidden flex">
<aside class="w-64 flex-col bg-[#F5C200] border-r border-black/10 flex shrink-0 justify-between">
    <div>
        <div class="p-5 border-b border-black/10 flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center shrink-0 shadow-md">
                <span class="font-black text-white text-2xl font-condensed">J</span>
            </div>
            <div>
                <h1 class="font-black text-black text-lg tracking-widest leading-none font-condensed">JCB HIRE</h1>
                <p class="text-[10px] text-black/70 font-bold uppercase tracking-widest mt-0.5">Maintenance Module</p>
            </div>
        </div>
        <nav class="p-3 space-y-1.5">
            <a href="/admin.html" class="w-full flex items-center justify-between px-3.5 py-3 rounded-lg text-base font-semibold text-black/80 hover:bg-black/10">
                <span class="flex items-center gap-3"><span>⊞</span><span class="font-condensed">DASHBOARD</span></span>
            </a>
            <a href="/maintenance.html" class="w-full flex items-center justify-between px-3.5 py-3 rounded-lg text-base font-bold bg-black text-white shadow">
                <span class="flex items-center gap-3"><span>🔧</span><span class="font-condensed">MAINTENANCE</span></span>
            </a>
        </nav>
    </div>
    <div class="p-4 border-t border-black/10 bg-black/5 flex items-center justify-between">
        <span class="text-xs font-bold text-black">Maintenance Tech</span>
        <a href="/login.html" class="text-xs font-bold text-red-700 hover:underline">Logout</a>
    </div>
</aside>

<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-14 bg-white border-b border-gray-200 px-6 flex items-center justify-between shrink-0">
        <h1 class="text-xl font-black font-condensed tracking-wide text-black uppercase">MAINTENANCE MANAGEMENT MODULE</h1>
        <span class="text-xs font-semibold text-gray-500">15 Sep 2026</span>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <section class="space-y-6">
            <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm space-y-4">
                <h2 class="text-base font-bold text-black flex items-center gap-2"><span>🔧</span> Add / Edit Maintenance Log & Request Spare Part</h2>
                <form onsubmit="event.preventDefault(); saveMaintenance();" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="hidden" id="maintId">
                    <div>
                        <label class="text-[11px] font-bold text-gray-600 block mb-1">SELECT MACHINE</label>
                        <select id="maintMachineId" class="w-full border rounded px-3 py-2 text-sm bg-white" required>
                            <option value="">Select Machine...</option>
                        </select>
                    </div>
                    <div><label class="text-[11px] font-bold text-gray-600 block mb-1">DESCRIPTION</label><input type="text" id="maintDesc" placeholder="Engine service & oil filter change" class="w-full border rounded px-3 py-2 text-sm" required></div>
                    <div><label class="text-[11px] font-bold text-gray-600 block mb-1">ESTIMATED COST (LKR)</label><input type="number" id="maintCost" placeholder="25000" class="w-full border rounded px-3 py-2 text-sm" required></div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-600 block mb-1">TASK STATUS</label>
                        <select id="maintTaskStatus" class="w-full border rounded px-3 py-2 text-sm bg-white font-bold text-blue-700">
                            <option value="IN_PROGRESS">🟡 IN PROGRESS</option>
                            <option value="COMPLETED">🟢 COMPLETED</option>
                            <option value="PENDING">🔴 PENDING</option>
                        </select>
                    </div>
                    <div class="col-span-full"><button type="submit" id="btnSaveMaint" class="bg-black hover:bg-gray-800 text-white text-xs font-bold px-6 py-3 rounded-lg">🔧 Log Maintenance Record</button></div>
                </form>
            </div>

            <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-bold text-black mb-4">📊 Maintenance Records</h2>
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-sm border-collapse">
                        <thead class="bg-[#1e293b] text-white text-xs font-bold uppercase">
                        <tr>
                            <th class="p-3 text-left">LOG ID</th>
                            <th class="p-3 text-left">MACHINE</th>
                            <th class="p-3 text-left">DESCRIPTION</th>
                            <th class="p-3 text-left">COST</th>
                            <th class="p-3 text-left">WORK STATUS</th>
                            <th class="p-3 text-left">ACTION</th>
                        </tr>
                        </thead>
                        <tbody id="maintTable" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
    let globalMaintenance = [];
    function loadMaintenance() {
        fetch('/api/machines').then(r=>r.json()).then(machines => {
            let dropdown = document.getElementById('maintMachineId');
            dropdown.innerHTML = '<option value="">Select Machine...</option>';
            (machines||[]).forEach(m => { dropdown.innerHTML += `<option value="${m.id}">#${m.id} - ${m.modelName}</option>`; });
        });

        fetch('/api/maintenances').then(r=>r.json()).then(data => {
            globalMaintenance = data || [];
            let tbody = document.getElementById('maintTable'); tbody.innerHTML = '';
            globalMaintenance.forEach(m => {
                let mName = m.machine ? m.machine.modelName : (m.machineId ? `Machine #${m.machineId}` : 'N/A');
                let taskStat = m.taskStatus || 'IN_PROGRESS';
                let taskBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-bold ${taskStat==='COMPLETED'?'bg-green-100 text-green-800':'bg-yellow-100 text-yellow-800'}">${taskStat}</span>`;
                tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 font-bold">#${m.id}</td>
                            <td class="p-3 font-bold uppercase">🚜 ${mName}</td>
                            <td class="p-3 text-gray-700 font-semibold">${m.description}</td>
                            <td class="p-3 font-bold text-red-600">LKR ${(m.cost||0).toLocaleString()}</td>
                            <td class="p-3">${taskBadge}</td>
                            <td class="p-3 flex items-center gap-2">
                                <button onclick="editMaint(${m.id})" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 font-bold rounded border">Edit</button>
                                <button onclick="deleteMaint(${m.id})" class="text-xs bg-red-50 text-red-600 px-2 py-1 font-bold rounded border">Delete</button>
                            </td>
                        </tr>`;
            });
        });
    }
    function saveMaintenance() {
        let logId = document.getElementById('maintId').value;
        let mId = document.getElementById('maintMachineId').value;
        let payload = { machine: {id: parseInt(mId)}, description: document.getElementById('maintDesc').value, cost: parseFloat(document.getElementById('maintCost').value), taskStatus: document.getElementById('maintTaskStatus').value, maintenanceDate: '2026-09-14' };
        fetch(logId ? `/api/maintenances/${logId}` : '/api/maintenances', { method: logId ? 'PUT' : 'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }).then(() => { document.getElementById('maintId').value = ''; loadMaintenance(); });
    }
    function editMaint(id) {
        let m = globalMaintenance.find(x => x.id === id);
        if (m) {
            document.getElementById('maintId').value = m.id;
            document.getElementById('maintMachineId').value = m.machine ? m.machine.id : (m.machineId || '');
            document.getElementById('maintDesc').value = m.description || '';
            document.getElementById('maintCost').value = m.cost || '';
            document.getElementById('maintTaskStatus').value = m.taskStatus || 'IN_PROGRESS';
        }
    }
    function deleteMaint(id) { if(confirm("Delete Log?")) fetch(`/api/maintenances/${id}`, {method:'DELETE'}).then(()=>loadMaintenance()); }
    window.onload = loadMaintenance;
</script>
</body>
</html>
