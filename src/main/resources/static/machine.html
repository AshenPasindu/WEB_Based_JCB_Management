<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB Hire - Machine Management Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Barlow', sans-serif; background-color: #f8fafc; font-size: 15px; }
        .font-condensed { font-family: 'Barlow Condensed', sans-serif; }
        .pulse-green { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse-green-anim 1.5s infinite; }
        @keyframes pulse-green-anim { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body class="h-screen overflow-hidden flex">
<aside class="w-64 flex-col bg-[#F5C200] border-r border-black/10 flex shrink-0 justify-between">
    <div>
        <div class="p-5 border-b border-black/10 flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center shrink-0 shadow-md">
                <span class="font-black text-white text-2xl font-condensed">J</span>
            </div>
            <div>
                <h1 class="font-black text-black text-lg tracking-widest leading-none font-condensed">JCB HIRE</h1>
                <p class="text-[10px] text-black/70 font-bold uppercase tracking-widest mt-0.5">Machine Module</p>
            </div>
        </div>
        <nav class="p-3 space-y-1.5">
            <a href="/admin.html" class="w-full flex items-center justify-between px-3.5 py-3 rounded-lg text-base font-semibold text-black/80 hover:bg-black/10">
                <span class="flex items-center gap-3"><span>⊞</span><span class="font-condensed">DASHBOARD</span></span>
            </a>
            <a href="/machine.html" class="w-full flex items-center justify-between px-3.5 py-3 rounded-lg text-base font-bold bg-black text-white shadow">
                <span class="flex items-center gap-3"><span>🚜</span><span class="font-condensed">MACHINE MANAGEMENT</span></span>
            </a>
        </nav>
    </div>
    <div class="p-4 border-t border-black/10 bg-black/5 flex items-center justify-between">
        <span class="text-xs font-bold text-black">Machine Manager</span>
        <a href="/login.html" class="text-xs font-bold text-red-700 hover:underline">Logout</a>
    </div>
</aside>

<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-14 bg-white border-b border-gray-200 px-6 flex items-center justify-between shrink-0">
        <h1 class="text-xl font-black font-condensed tracking-wide text-black uppercase">MACHINE MANAGEMENT MODULE</h1>
        <span class="text-xs font-semibold text-gray-500">15 Sep 2026</span>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <section class="space-y-6">
            <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-bold text-black mb-4">🚜 Add / Edit Machinery</h2>
                <form onsubmit="event.preventDefault(); saveMachine();" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="hidden" id="mId">
                    <div><label class="text-[11px] font-bold text-gray-500 block mb-1">MODEL NAME</label><input type="text" id="mName" placeholder="e.g. JCB 3CX Backhoe" class="w-full border rounded px-3 py-2 text-sm" required></div>
                    <div><label class="text-[11px] font-bold text-gray-500 block mb-1">HOURLY RATE (LKR)</label><input type="number" id="mRate" placeholder="3400" class="w-full border rounded px-3 py-2 text-sm" required></div>
                    <div><label class="text-[11px] font-bold text-gray-500 block mb-1">IMAGE URL</label><input type="text" id="mImage" placeholder="https://..." class="w-full border rounded px-3 py-2 text-sm"></div>
                    <div><label class="text-[11px] font-bold text-gray-500 block mb-1">STATUS</label><select id="mStatus" class="w-full border rounded px-3 py-2 text-sm bg-white"><option value="Available">Available</option><option value="Under Maintenance">Under Maintenance</option><option value="Booked">Booked</option></select></div>
                    <div class="col-span-full"><button type="submit" class="bg-black text-white text-xs font-bold px-4 py-2.5 rounded hover:bg-gray-800">💾 Save Machinery</button></div>
                </form>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-bold text-black mb-4">📊 Fleet Machinery List</h2>
                <table class="w-full text-sm border-collapse"><thead class="bg-[#1e293b] text-white text-xs font-bold uppercase"><tr><th class="p-3 text-left">ID</th><th class="p-3 text-left">IMAGE</th><th class="p-3 text-left">MODEL NAME</th><th class="p-3 text-left">RATE/HR</th><th class="p-3 text-left">STATUS</th><th class="p-3 text-left">ACTION</th></tr></thead><tbody id="mTable" class="divide-y divide-gray-100"></tbody></table>
            </div>
        </section>
    </main>
</div>

<script>
    let globalMachines = [];
    function loadMachines() {
        fetch('/api/machines').then(r=>r.json()).then(data => {
            globalMachines = data || [];
            let tbody = document.getElementById('mTable'); tbody.innerHTML = '';
            globalMachines.forEach(m => {
                let img = m.imageUrl || 'https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=800&q=80';
                let isAvail = (m.status || 'Available').toLowerCase() === 'available';
                tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 font-bold">#${m.id}</td>
                            <td class="p-3"><img src="${img}" class="w-10 h-8 object-cover rounded"></td>
                            <td class="p-3 font-bold uppercase">${m.modelName}</td>
                            <td class="p-3 font-bold">LKR ${(m.hourlyRate||0).toLocaleString()}</td>
                            <td class="p-3">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-xs font-bold rounded-full ${isAvail ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                    ${isAvail ? '<span class="w-2 h-2 rounded-full bg-green-500 pulse-green"></span>' : ''}
                                    ${m.status || 'Available'}
                                </span>
                            </td>
                            <td class="p-3 flex gap-2">
                                <button onclick="editMachine(${m.id})" class="text-xs bg-blue-50 text-blue-600 px-2 py-1 font-bold rounded border border-blue-200">Edit</button>
                                <button onclick="deleteMachine(${m.id})" class="text-xs bg-red-50 text-red-600 px-2 py-1 font-bold rounded border border-red-200">Delete</button>
                            </td>
                        </tr>`;
            });
        });
    }
    function saveMachine() {
        let id = document.getElementById('mId').value;
        let payload = { modelName: document.getElementById('mName').value, hourlyRate: parseFloat(document.getElementById('mRate').value), imageUrl: document.getElementById('mImage').value, status: document.getElementById('mStatus').value };
        fetch(id?`/api/machines/${id}`:'/api/machines', { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }).then(()=>{ document.getElementById('mId').value=''; document.getElementById('mName').value=''; document.getElementById('mRate').value=''; loadMachines(); });
    }
    function editMachine(id) { let m = globalMachines.find(x=>x.id===id); if(m){ document.getElementById('mId').value=m.id; document.getElementById('mName').value=m.modelName; document.getElementById('mRate').value=m.hourlyRate; document.getElementById('mImage').value=m.imageUrl||''; document.getElementById('mStatus').value=m.status||'Available'; } }
    function deleteMachine(id) { if(confirm("Delete Machine?")) fetch(`/api/machines/${id}`, {method:'DELETE'}).then(()=>loadMachines()); }
    window.onload = loadMachines;
</script>
</body>
</html>
