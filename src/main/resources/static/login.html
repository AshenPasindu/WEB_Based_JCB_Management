<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB Hire - System Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Barlow', sans-serif; background-color: #0f172a; }
        .font-condensed { font-family: 'Barlow Condensed', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 p-4">

<div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <!-- Logo & Header -->
    <div class="text-center mb-8">
        <div class="w-14 h-14 bg-[#F5C200] text-black rounded-2xl flex items-center justify-center font-black text-3xl font-condensed mx-auto mb-3 shadow-lg shadow-[#F5C200]/10">
            J
        </div>
        <h1 class="text-2xl font-black text-white font-condensed tracking-wider uppercase">SYSTEM LOGIN</h1>
        <p class="text-xs text-gray-400 font-medium mt-1">JCB Fleet Management Portal</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
        <div>
            <label class="text-xs font-bold text-gray-300 block mb-1.5 uppercase">Email Address</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400 text-sm">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                <input
                        type="email"
                        id="email"
                        placeholder="admin@gmail.com"
                        class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-[#F5C200] transition-colors"
                        required
                >
            </div>
        </div>

        <div>
            <label class="text-xs font-bold text-gray-300 block mb-1.5 uppercase">Password</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-[#F5C200] transition-colors"
                        required
                >
            </div>
        </div>

        <button
                type="submit"
                class="w-full bg-[#F5C200] hover:bg-yellow-400 text-black font-black py-3.5 rounded-xl transition-all shadow-lg text-sm uppercase tracking-wider font-condensed mt-2 flex items-center justify-center gap-2"
        >
            <span>Sign In to System</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>

    <!-- Alert Notification Box -->
    <div id="loginAlert" class="mt-4"></div>

    <!-- Back Link -->
    <div class="mt-6 text-center border-t border-slate-800 pt-4">
        <a href="index.html" class="text-xs text-gray-400 hover:text-[#F5C200] font-semibold transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Customer Reservation Page</span>
        </a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('loginAlert');

        alertBox.innerHTML = `<div class="bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold p-3 rounded-xl text-center">Authenticating...</div>`;

        fetch('http://localhost:8080/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        })
            .then(res => res.json())
            .then(user => {
                if(user && user.role) {
                    // Save Current User details to Browser Local Storage
                    localStorage.setItem('loggedUser', JSON.stringify(user));

                    if(user.role === 'ADMIN') {
                        window.location.href = 'admin.html'; // Navigate to Admin Panel
                    } else {
                        window.location.href = 'index.html'; // Navigate to Customer Home Page
                    }
                } else {
                    alertBox.innerHTML = `<div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold p-3 rounded-xl text-center">❌ Invalid Email or Password!</div>`;
                }
            })
            .catch(err => {
                alertBox.innerHTML = `<div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold p-3 rounded-xl text-center">❌ Invalid Credentials or Server Error!</div>`;
            });
    });
</script>
</body>
</html>
